<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중국 SNS 상품 발굴</title><link rel="stylesheet" href="/style.css"><style>body{padding:18px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;gap:10px}.card{padding:14px;border:1px solid var(--border);background:var(--surface-2);border-radius:14px}.thumb{width:110px;height:110px;object-fit:cover;border-radius:10px}.match{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px;border-top:1px solid var(--border)}.match img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:8px}input,select,textarea{width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><div class="panel-head"><h1>🇨🇳 중국 SNS 상품 발굴</h1><a class="btn-secondary" href="/">메인으로</a></div><p class="hint">Douyin / Xiaohongshu 수집 결과를 저장하고 영상 → 대표 프레임 → Lens → Product Resolver → 쿠팡 매칭으로 처리합니다.</p><div id="stats" class="row"></div></div><div class="grid"><div class="panel"><h2>모니터링 대상 추가</h2><label>플랫폼<select id="platform"><option>DOUYIN</option><option>XIAOHONGSHU</option></select></label><label>종류<select id="targetType"><option>ACCOUNT</option><option>HASHTAG</option><option>KEYWORD</option></select></label><label>값<input id="targetValue" placeholder="계정 / 해시태그 / 검색어"></label><button id="addTarget" class="btn-primary">추가</button><div id="targets" class="cards"></div></div><div class="panel"><h2>게시물 직접 등록</h2><p class="hint">Collector가 자동 수집할 때도 동일한 /api/discovery/ingest 형식으로 저장됩니다.</p><label>플랫폼<select id="postPlatform"><option>DOUYIN</option><option>XIAOHONGSHU</option></select></label><label>게시물 ID<input id="externalPostId"></label><label>원본 URL<input id="sourceUrl"></label><label>영상 URL<input id="videoUrl"></label><label>본문<textarea id="caption" rows="4"></textarea></label><button id="ingest" class="btn-primary">게시물 저장</button></div></div><div class="panel"><div class="panel-head"><h2>수집 콘텐츠 / 상품 매칭</h2><button id="refresh" class="btn-secondary">새로고침</button></div><div id="posts" class="cards"></div></div></div><script src="/discovery.js"></script></body></html>
