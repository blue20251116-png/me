<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중국 SNS 상품 발굴</title><link rel="stylesheet" href="/style.css"><style>body{padding:18px}.wrap{max-width:1280px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cards{display:grid;gap:14px}.card{padding:16px;border:1px solid var(--border);background:var(--surface-2);border-radius:14px}.review-grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(360px,1.1fr);gap:16px}.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-box{background:#0e1117;border-radius:12px;padding:10px}.video-box h4{margin:0 0 8px}.video-box video{width:100%;aspect-ratio:9/16;max-height:520px;background:#000;border-radius:10px}.ai-box{padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}.match{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-top:10px}.match.confirmed{outline:2px solid #35c46a}.match img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:9px}.score{font-weight:700}.affiliate{padding:10px;border-radius:9px;background:var(--surface);word-break:break-all;margin-top:8px}.muted{opacity:.72}.post-title{margin:8px 0}.section-title{margin:0 0 10px}.empty-video{display:flex;align-items:center;justify-content:center;min-height:180px;border:1px dashed var(--border);border-radius:10px;text-align:center;padding:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}input,select,textarea{width:100%}@media(max-width:900px){.review-grid,.grid{grid-template-columns:1fr}.video-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.video-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><div class="panel-head"><h1>🇨🇳 중국 영상 ↔ 쿠팡 상품 매칭</h1><a class="btn-secondary" href="/">메인으로</a></div><p class="hint">지금은 영상과 쿠팡 상품의 매칭 정확도 검수에 집중합니다. 원본과 자막 제거 영상을 비교하고 쿠팡 후보를 직접 확정할 수 있습니다.</p><div id="stats" class="row"></div></div><div class="grid"><div class="panel"><h2>모니터링 대상</h2><label>플랫폼<select id="platform"><option>DOUYIN</option><option>XIAOHONGSHU</option></select></label><label>종류<select id="targetType"><option>ACCOUNT</option><option>HASHTAG</option><option>KEYWORD</option></select></label><label>값<input id="targetValue" placeholder="계정 / 해시태그 / 검색어"></label><button id="addTarget" class="btn-primary">추가</button><div id="targets" class="cards"></div></div><div class="panel"><h2>게시물 직접 등록</h2><p class="hint">테스트할 중국 영상이 있으면 여기서 직접 넣을 수 있습니다.</p><label>플랫폼<select id="postPlatform"><option>DOUYIN</option><option>XIAOHONGSHU</option></select></label><label>게시물 ID<input id="externalPostId"></label><label>원본 URL<input id="sourceUrl"></label><label>영상 URL<input id="videoUrl"></label><label>본문<textarea id="caption" rows="4"></textarea></label><button id="ingest" class="btn-primary">게시물 저장</button></div></div><div class="panel"><div class="toolbar"><h2>영상 / 쿠팡 상품 검수</h2><button id="refresh" class="btn-secondary">새로고침</button></div><div id="posts" class="cards"></div></div></div><script src="/discovery.js"></script></body></html>
